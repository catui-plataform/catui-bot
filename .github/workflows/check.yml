name: Check bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff==0.17.1
      - run: python -m ruff check catui_bot tools validation tests --select F,E9
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_public.py
      - run: python tools/package_deploy.py
